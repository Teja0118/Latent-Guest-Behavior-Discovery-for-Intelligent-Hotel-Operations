<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>
        Prediction History
    </title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

</head>

<body>

    <div class="top-navbar">

        <h1>
            Hotel Guest Behavior Intelligence
        </h1>

    </div>

    <div class="layout-container">

        <div class="sidebar">

            <a href="/">
                <i class="fas fa-house"></i>
                Home
            </a>

            <a href="/predict">
                <i class="fas fa-brain"></i>
                Predict
            </a>

            <a href="/analytics">
                <i class="fas fa-chart-pie"></i>
                Analytics
            </a>

            <a href="/history" class="active">
                <i class="fas fa-clock-rotate-left"></i>
                History
            </a>

            <a href="/about">
                <i class="fas fa-circle-info"></i>
                About
            </a>

            <a
                href="#"
                onclick="logout()"
            >
                🚪 Logout
            </a>
        </div>

        <div class="main-content">

            <!-- EXISTING PAGE CONTENT HERE -->
            <div class="container">

                <div class="page-header">

                    <div>

                        <h1>
                            Prediction History
                        </h1>

                        <p>
                            View all historical guest
                            predictions and operational
                            intelligence logs.
                        </p>

                    </div>

                    <div class="header-badge">

                        Historical Records

                    </div>

                </div>

                <div class="search-bar-container">

                    <input
                        type="text"
                        placeholder="Search cluster name..."
                        class="search-input"
                    >

                </div>

                <div class="history-card">

                    <table id="history-table">

                    </table>

                </div>

            </div>
        </div>

    </div>

    

    <script src="/static/history.js"></script>
    <script src="/static/auth_guard.js"></script>
    <script src="/static/auth.js"></script>
</body>

</html>
