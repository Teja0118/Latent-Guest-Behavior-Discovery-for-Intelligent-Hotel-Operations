<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Prediction History
    </title>

    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/history.css">
    <link rel="stylesheet" href="/static/css/responsive.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

</head>

<body>

    <div class="top-navbar">

        <h1>
            Hotel Guest Behavior Intelligence
        </h1>

        <button
            class="theme-toggle"
            onclick="toggleTheme()"
        >

            <i
                id="theme-icon"
                class="fas fa-moon"
            ></i>

        </button>

    </div>

    <div class="layout-container">

        <div class="sidebar">

            <a href="/">
                <i class="fas fa-house"></i>
                Home
            </a>

            <a href="/predict">
                <i class="fas fa-brain"></i>
                Predict
            </a>

            <a href="/analytics">
                <i class="fas fa-chart-pie"></i>
                Analytics
            </a>

            <a href="/history" class="active">
                <i class="fas fa-clock-rotate-left"></i>
                History
            </a>

            <a href="/about">
                <i class="fas fa-circle-info"></i>
                About
            </a>
            <a
                href="#"
                onclick="logout()"
                class="logout-link"
            >
                <i class="fas fa-right-from-bracket"></i>
                Logout
            </a>
        </div>

        <div class="main-content">

            <!-- EXISTING PAGE CONTENT HERE -->
            <div class="container">

                <div class="page-header">

                    <div>

                        <h1>
                            Prediction History
                        </h1>

                        <p>
                            View all historical guest
                            predictions and operational
                            intelligence logs.
                        </p>

                    </div>

                    <div class="header-badge">

                        Historical Records

                    </div>

                </div>

                <div
                    id="history-summary"
                    class="history-summary-grid"
                >

                </div>


                <div class="history-actions">

                    <button
                        class="export-btn"
                        onclick="exportHistoryCSV()"
                    >

                        <i class="fas fa-file-csv"></i>

                        Export CSV

                    </button>

                </div>

                <div class="search-bar-container">

                    <div class="history-search-wrapper">

                        <input
                            type="text"
                            placeholder="Search cluster name..."
                            class="search-input"
                        >

                        <button
                            type="button"
                            class="history-search-clear"
                            onclick="clearHistorySearch()"
                            aria-label="Clear search"
                            title="Clear search"
                        >
                            <i class="fas fa-xmark"></i>
                        </button>

                    </div>

                </div>

                <div class="history-card">

                    <table id="history-table">

                    </table>

                </div>

            </div>
        </div>

    </div>

    

    <script src="/static/history.js"></script>
    <script src="/static/auth_guard.js"></script>
    <script src="/static/auth.js"></script>
    <script src="/static/theme.js"></script>
</body>

</html>
