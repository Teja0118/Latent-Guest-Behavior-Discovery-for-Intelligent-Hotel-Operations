<!DOCTYPE html>
<html>

<head>

    <title>Register</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>

<body>

    <div class="auth-page">

        <div class="auth-card">

            <h1>
                Register
            </h1>

            <input
                id="name"
                placeholder="Name"
            >

            <input
                id="email"
                type="email"
                placeholder="Email"
            >

            <input
                id="password"
                type="password"
                placeholder="Password"
            >

            <button onclick="registerUser()">
                Register
            </button>

            <p>

                Already have an account?

                <a href="/login-page">

                    Login

                </a>

            </p>

        </div>

    </div>

    <script src="/static/auth.js"></script>

</body>

</html>
